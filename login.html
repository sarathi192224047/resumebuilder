<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            width: 800px;
            height: 500px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        .left-box {
            flex: 1;
            background-color:  rgb(0, 200, 230);
            border-top-right-radius: 100px;
            border-bottom-left-radius: 100px;
            padding-bottom: 40px;
            padding-left: 40px;
            padding-right: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .left-box img {
            width:60px; 
            height: auto;
            margin-bottom: 5px;
        }
        .left-box h4{
            color: white;
            font-size: 1em;
            margin-bottom: 30px;
        }

        .left-box p {
            font-size: 25px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .left-box h6 {
            font-size: 1em;
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: center;
        }

        .login-box {
            flex: 1;
            padding: 40px;
            padding-left: 100px;
            padding-right: 100px;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-box h2 {
            font-size: 25px;
            margin-bottom: 5px;
            font-weight: bold;
            color: black;
            text-align: center;
        }
        .login-box h6{
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        .login-box p{
            font-size: 12px;
        }
        .PLACEHOLDER::placeholder{
            color: black;
            font-size: 10px;
            font-weight: bold;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            background-color:rgba(0, 199, 230, 0.423);
            border-left: 5px solid rgb(0, 160, 185);
            border-radius: 10px;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            border: 5px solid rgba(0, 199, 230, 0.423);
            background-color: rgba(0, 199, 230, 0.423);
            color: black;
            font-weight: bold;
            font-size: 1em;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 5px 10px rgba(0, 123, 255, 0.3);
        }

        .login-box button:hover {
            background-color:   rgb(0, 200, 230);
        }
        .signup-link {
            margin-top: 15px;
            text-align: center;
            color: #333;
        }

        .signup-link a {
            color: #3f51b5;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }
        .forget a {
            color: #3f51b5;
            text-decoration: none;
        }

        .forget a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-box">
            <img src="rect1.png" alt="Logo"> 
            <h4>ME ON PAPER</h4>
            <h6>Feels good to reconnect after all this time.</h6>
            <p>WELCOME BACK!!!</p>
        </div>
        <div class="login-box">
            <h2>WARM GREETINGS</h2>
            <h6>Login in to your account to get started</h6>
            <form action="login.php" method="POST">
                <input type="text" id="username" name="fullname" required class="PLACEHOLDER" placeholder="USERNAME">

                <input type="password" id="password" name="pwsd" required class="PLACEHOLDER" placeholder="PASSWORD">
                <p class="forget"> <a href="forgetpswd.php">forget password ?</a></p>
                <button type="submit">LOGIN</button>
            </form>
            <p class="signup-link">Don't have an account? <a href="signup.html">Sign in</a></p>
        </div>
    </div>
</body>
</html>
