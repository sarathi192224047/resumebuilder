<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder - Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            width: 800px;
            height: auto;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        .left-box {
            flex: 1;
            background-color:  rgb(0, 200, 230);
            border-top-right-radius: 100px;
            border-bottom-left-radius: 100px;
            padding-left: 40px;
            padding-right: 40px;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .left-box img {
            width: 60px; 
            height: auto;
            margin-bottom: 5px;
        }

        .left-box h4 {
            color: white;
            font-size: 1em;
            margin-bottom: 30px;
        }

        .left-box p {
            font-size: 25px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .left-box h6 {
            font-size: 14px;
            line-height: 1.5;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }

        .signup-box {
            flex: 1;
            padding: 40px;
            padding-left: 100px;
            padding-right: 100px;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .signup-box p {
            font-size: 12px;
        }

        .signup-box h1 {
            font-size: 25px;
            margin-bottom: 5px;
            font-family: readex pro,sans-serif;
            font-weight: bold;
            color: black;
            text-align: center;
        }

        .signup-box h6 {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .signup-box input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            background-color: rgba(0, 199, 230, 0.423);
            border-left: 5px solid rgb(0, 200, 230);
            border-radius: 10px;
            color: black;
            font-weight: bold;
            font-size: 12px;
        }

        .signup-box input::placeholder {
            color: black;
            font-weight: bold;
        }

        .signup-box textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-left:5px solid rgb(0, 200, 230);
            background-color: rgba(0, 199, 230, 0.423);
            border-radius: 10px;
            color: black;
            font-weight: bold;
            font-size: 12px;
            resize: none;
        }

        .signup-box textarea::placeholder {
            color: black;
            font-weight: bold;
        }

        .signup-box button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            border: 5px solid rgba(0, 199, 230, 0.423);
            background-color: rgba(0, 199, 230, 0.423);
            color: black;
            font-weight: bold;
            font-size: 1em;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 5px 10px rgba(0, 123, 255, 0.3);
        }

        .signup-box button:hover {
            background-color: rgb(0, 200, 230);
        }
        .login-link {
            margin-top: 15px;
            text-align: center;
            color: #333;
        }

        .login-link a {
            color: #3f51b5;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-box">
            <img src="rect1.png" alt="Logo"> 
            <h4>ME ON PAPER</h4>
            <h6>Experience the new way of building your resumes.</h6>
            <p>JOIN US TODAY!</p>
        </div>
        <div class="signup-box">
            <h1>SIGN UP</h1>
            <h6>Create your account</h6>
            <form action="signup.php" method="post">
                <input type="text" name="fullname" required placeholder="FULL NAME">
                <input 
                    type="email" 
                    name="email" 
                    required 
                    placeholder="EMAIL" 
                    pattern="[a-z0-9._%+-]+@(gmail\.com|outlook\.com|yahoo\.com|hotmail\.com)$" 
                    title="Only Gmail, Outlook, Yahoo, or Hotmail email addresses are allowed."
                >
                <textarea name="bio" rows="4" placeholder="SHORT BIO"></textarea>
                <input type="text" name="profession" placeholder="PROFESSION">
                <input type="password" name="pwsd" required placeholder="PASSWORD">
                <input type="password" name="cpswd" required placeholder="CONFIRM PASSWORD">
                <button type="submit">SIGN UP</button>
            </form>
            <p class="login-link">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </div>
</body>
</html>
